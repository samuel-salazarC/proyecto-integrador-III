# Tema de la app (app/streamlit_app.py). Streamlit lee este archivo desde la carpeta en que
# se ejecuta (la raíz del repositorio, tanto local como en Community Cloud).
#
# Colores con significado fijo en toda la página (definidos en la app, no aquí):
#   azul #0072B2 = hay evidencia de la obra; bermellón #D55E00 = no hay evidencia.
# El tema usa solo neutros: papel cálido en claro, carbón en oscuro, tinta como color
# primario (botones, foco, controles) para no competir con esos dos colores.

[client]
toolbarMode = "minimal"

# Sirve app/static/ en /app/static/ (fotos del recorrido y del time-lapse, por URL en vez de
# incrustadas en cada recarga).
[server]
enableStaticServing = true

[theme]
font = "sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseFontSize = 17
baseRadius = "0.6rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#1A1A19"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EFE9"
textColor = "#1A1A19"
linkColor = "#1A1A19"
borderColor = "#DEDBD3"

[theme.dark]
primaryColor = "#EDEBE6"
backgroundColor = "#141413"
secondaryBackgroundColor = "#1F1F1D"
textColor = "#EDEBE6"
linkColor = "#EDEBE6"
borderColor = "#3A3936"
